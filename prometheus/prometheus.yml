# Week 09: Prometheus scrapes the FastAPI service over the Compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: weather-dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
